<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>政策效力核验与可溯源引用引擎 · 演示</title>
<style>
/* ────────────────────────────────────────────────────────────────
   主题：浅色为默认，深色跟随系统；右上角可手动切换。
   所有颜色都走变量，避免深色下出现"白底黑字看不见"。
   ──────────────────────────────────────────────────────────────── */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#fafbfc; --line:#e3e6ea;
  --ink:#1c2024; --ink2:#5a626b; --ink3:#8b939c;
  --accent:#2f6fd0; --accent-soft:#e8f0fc;
  --ok:#1f8a4c; --ok-soft:#e6f5ec;
  --warn:#a9701a; --warn-soft:#fdf3e0;
  --stop:#7a4bd0; --stop-soft:#f0eafc;
  --bad:#c23b3b; --bad-soft:#fceaea;
  --rule:#eef1f4;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
html[data-theme="dark"]{
  --bg:#15181c; --panel:#1d2126; --panel2:#22272d; --line:#31373e;
  --ink:#e8ebee; --ink2:#a8b1ba; --ink3:#79828c;
  --accent:#6fa4e8; --accent-soft:#1e2b3d;
  --ok:#59c98a; --ok-soft:#16281e;
  --warn:#e0b25e; --warn-soft:#2c2416;
  --stop:#a98ae8; --stop-soft:#241d33;
  --bad:#e07373; --bad-soft:#2e1a1a;
  --rule:#2a3037;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
     font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 72px}

/* 页头 */
header{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:21px;margin:0 0 4px;letter-spacing:.2px}
.sub{color:var(--ink2);font-size:13.5px;margin:0}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
button{font-family:inherit;font-size:13.5px;cursor:pointer;border-radius:8px;
       border:1px solid var(--line);background:var(--panel);color:var(--ink);
       padding:7px 14px;transition:.15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{filter:brightness(1.08);color:#fff}
button:disabled{opacity:.55;cursor:default}

/* 说明条 */
.howto{margin:18px 0 20px;padding:13px 16px;background:var(--panel);border:1px solid var(--line);
       border-left:3px solid var(--accent);border-radius:9px;font-size:13.5px;color:var(--ink2)}
.howto b{color:var(--ink);font-weight:600}
.howto .steps{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}

/* 提问区 */
.askbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.askrow{display:flex;gap:10px}
input[type=text]{flex:1;padding:11px 13px;border-radius:9px;border:1px solid var(--line);
                 background:var(--panel2);color:var(--ink);font-family:inherit;font-size:14.5px}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px dashed var(--line);background:transparent;color:var(--ink2);
      padding:5px 11px;border-radius:20px;font-size:12.5px}
.chip:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}

/* 提示 */
.note{margin-top:12px;font-size:13px;color:var(--ink3)}
.banner{margin:16px 0 0;padding:10px 14px;border-radius:9px;font-size:13px;
        background:var(--accent-soft);color:var(--accent);border:1px solid transparent}
.banner.offline{background:var(--warn-soft);color:var(--warn)}

/* 结果 */
#result{margin-top:22px}
.verdict{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
         background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.badge{font-size:16px;font-weight:700;padding:6px 15px;border-radius:8px;letter-spacing:.5px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.stop{background:var(--stop-soft);color:var(--stop)}
.vmeta{font-size:13px;color:var(--ink2)}
.vmeta code{font-family:var(--mono);background:var(--rule);padding:1px 6px;border-radius:5px;font-size:12.5px}
.qecho{margin-left:auto;font-size:12.5px;color:var(--ink3);max-width:46%;text-align:right}

.grid{display:grid;gap:14px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
.card.wide{grid-column:1/-1}
.card h2{font-size:13px;margin:0 0 10px;color:var(--ink2);font-weight:600;letter-spacing:.6px}
.concl{font-size:15.5px;line-height:1.7}
.empty{color:var(--ink3);font-size:13.5px}

/* 依据行 */
.cite{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px}
.cite:last-child{border-bottom:none}
.tick{flex:none;width:17px;font-weight:700;text-align:center}
.tick.y{color:var(--ok)} .tick.n{color:var(--bad)}
.cite .law{font-weight:600}
.cite .art{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.cite .why{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}

/* 表 */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--ink3);font-weight:600;font-size:12px;letter-spacing:.4px;white-space:nowrap}
td.mono{font-family:var(--mono);font-size:12.5px}
.st{font-weight:600}
.st.cur{color:var(--ok)} .st.gone{color:var(--bad)} .st.unk{color:var(--warn)}

/* 检查卡 */
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--rule)}
.check:last-child{border-bottom:none}
.lvl{flex:none;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;min-width:46px;text-align:center}
.lvl.pass{background:var(--ok-soft);color:var(--ok)}
.lvl.block{background:var(--bad-soft);color:var(--bad)}
.lvl.warn{background:var(--warn-soft);color:var(--warn)}
.lvl.info{background:var(--rule);color:var(--ink3)}
.ckname{font-weight:600;font-size:13.5px}
.ckcode{font-family:var(--mono);color:var(--ink3);font-size:12px;margin-right:6px}
.ckdetail{color:var(--ink2);font-size:12.5px;margin-top:3px}
.ckdetail div{padding-left:2px}

/* 理由 */
ul.reasons{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink2)}
ul.reasons li{margin:3px 0}

/* 原始 */
details{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 17px}
summary{cursor:pointer;font-size:13.5px;color:var(--ink2);font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.5px;
    background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:13px;
    margin:12px 0 0;max-height:440px;overflow:auto;color:var(--ink)}
footer{margin-top:34px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line);padding-top:14px}
footer code{font-family:var(--mono)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
      border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>政策效力核验与可溯源引用引擎</h1>
    <p class="sub">给出的不是「看起来像」的答案，而是逐条可反查的引用、明确的效力状态、以及在给不出依据时的明确拒答。</p>
  </div>
  <div class="tools">
    <button id="theme">切换主题</button>
  </div>
</header>

<div class="howto">
  <b>这一页在演示什么。</b>你问一条法规怎么规定，系统走三步：
  <div class="steps">
    <span>① <b>检索</b> 从 8 部法规里召回相关条文</span>
    <span>② <b>核验</b> 用确定性规则核对条号、引用出处、时效（不调用模型）</span>
    <span>③ <b>交付</b> 按校验后的强度给出结论：可作答 / 部分作答 / 拒答</span>
  </div>
</div>

<div class="askbox">
  <div class="askrow">
    <input type="text" id="q" placeholder="输入一个关于法规条文的问题……" autocomplete="off">
    <button class="primary" id="go">核验</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="note" id="note"></div>
</div>

<div id="banner"></div>
<div id="result"></div>

<footer>
  判定由 <code>scripts/gatekeeper.py</code>（闸门 2 · 不调用模型的确定性校验层）给出；
  页面只是它的展示层。示例问答取自评估集 v7 的真实输出，可离线查看。
</footer>

</div>

<script>
"use strict";
const SAMPLES = JSON.parse(document.getElementById("samples").textContent);
const LVL = {pass:["通过","pass"], block:["拦截","block"], warn:["提示","warn"], info:["记录","info"]};
const BADGE_CLS = {"可作答":"ok","部分作答":"warn","拒答":"stop"};
let live = false;

/* 主题：优先用本地记忆，否则跟随系统 */
(function(){
  const saved = localStorage.getItem("pv-theme");
  const sys = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = saved || sys;
})();
document.getElementById("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nxt;
  localStorage.setItem("pv-theme", nxt);
};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 模型会写 **加粗**，先转义再还原加粗（顺序不能反，否则等于开了 XSS 的口子） */
const md = s => esc(s).replace(/\*\*([^*\n]{1,60})\*\*/g, "<strong>$1</strong>");

/* ── 渲染 ─────────────────────────────────────────────────────── */
function render(rec){
  const r = document.getElementById("result");
  const b = BADGE_CLS[rec.boundary] || "stop";
  const mbsame = rec.model_boundary
      ? (rec.model_boundary === rec.boundary ? "与规则判定一致" : "与规则判定不一致，已按更保守的一方采纳")
      : "模型未自报";

  const cites = (rec.cites || []).length
    ? rec.cites.map(c => `
        <div class="cite">
          <span class="tick ${c.ok ? "y" : "n"}">${c.ok ? "✓" : "✗"}</span>
          <span>
            <span class="law">《${esc(c.law || c.raw_law)}》</span>
            ${c.law ? "" : '<span class="why">（库内没有这部法规的全文）</span>'}
            <span class="art">${esc(c.art)}</span>
            <span class="why">${esc(c.note)}　·　来源：${esc(c.source)}</span>
          </span>
        </div>`).join("")
    : `<div class="empty">无可用依据${rec.manifest_status === "none" ? "（回答声明「引用清单：无」）" : ""}。</div>`;

  const stale = (rec.staleness || []).length
    ? `<table><thead><tr><th>文件</th><th>效力状态</th><th>失效日期</th></tr></thead><tbody>
        ${rec.staleness.map(s => `
          <tr>
            <td>《${esc(s.name)}》</td>
            <td class="st ${!s.in_ledger ? "unk" : (s.abolished ? "gone" : "cur")}" style="white-space:nowrap">${esc(s.status)}</td>
            <td class="mono" style="white-space:nowrap">${esc(s.abolished || "—")}</td>
          </tr>`).join("")}
      </tbody></table>
      ${rec.staleness.some(s => !s.in_ledger) ? '<div class="empty" style="margin-top:8px">标「未知」的文件不在时效台账里，不做有利假设。</div>' : ""}`
    : `<div class="empty">问题未指向库内法规，回答也未引用库内法规 → 本轮不做时效比对。</div>`;

  const manifest = (rec.manifest || []).length
    ? `<table><thead><tr><th>法规全名</th><th>条号</th></tr></thead><tbody>
        ${rec.manifest.map(([l, a]) => `<tr><td>${esc(l)}</td><td class="mono">${esc(a)}</td></tr>`).join("")}
      </tbody></table>`
    : `<div class="empty">无（清单状态：${esc(rec.manifest_status)}）</div>`;

  const bf = rec.boundary_fields || {};
  const bfRows = ["引用法规在库内","所问条号核验","时效状态","结论边界"]
    .map(k => `<tr><td>${k}</td><td class="mono">${esc(bf[k] || "—（模型未填写）")}</td></tr>`).join("");

  const checks = (rec.checks || []).map(c => {
    const cls = c.passed ? "pass" : (c.level === "block" ? "block" : (c.level === "warn" ? "warn" : "info"));
    const label = c.passed ? "通过" : (c.level === "block" ? "拦截" : (c.level === "warn" ? "提示" : "记录"));
    return `<div class="check">
      <span class="lvl ${cls}">${label}</span>
      <div>
        <span class="ckcode">${esc(c.code)}</span><span class="ckname">${esc(c.name)}</span>
        ${(c.detail || []).length ? `<div class="ckdetail">${c.detail.map(d => `<div>· ${esc(d)}</div>`).join("")}</div>` : ""}
      </div>
    </div>`;
  }).join("");

  r.innerHTML = `
    <div class="verdict">
      <span class="badge ${b}">${esc(rec.badge || rec.boundary)}</span>
      <span class="vmeta">
        由 <code>${esc(rec.decided_by)}</code> 判定　·　模型自报
        <code>${esc(rec.model_boundary || "—")}</code>（${mbsame}）　·　本次召回
        <code>${rec.n_res}</code> 段
      </span>
      <span class="qecho">${esc(rec.question)}</span>
    </div>

    <div class="grid">
      <div class="card wide">
        <h2>结论</h2>
        <div class="concl">${md(rec.conclusion) || '<span class="empty">（见下方原始回答）</span>'}</div>
      </div>

      <div class="card">
        <h2>依据（逐条核对）</h2>
        ${cites}
      </div>

      <div class="card">
        <h2>相关文件时效</h2>
        ${stale}
      </div>

      <div class="card">
        <h2>引用清单（可溯源凭据）</h2>
        ${manifest}
      </div>

      <div class="card">
        <h2>模型自报的【边界判定】四行</h2>
        <table><tbody>${bfRows}</tbody></table>
      </div>

      <div class="card wide">
        <h2>四项确定性校验（闸门 2 · 不调用模型）</h2>
        ${checks}
      </div>

      <div class="card wide">
        <h2>判定理由</h2>
        <ul class="reasons">${(rec.reasons || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      </div>
    </div>

    <details>
      <summary>模型原始回答（未经格式化的完整输出）</summary>
      <pre>${esc(rec.answer)}</pre>
    </details>`;
}

/* ── 提问：优先走本地服务，不通则用内置样本 ────────────────────── */
async function ask(q){
  if (live){
    const r = await fetch("/api/ask", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({question: q})
    });
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j;
  }
  const hit = SAMPLES.find(s => s.question === q)
           || SAMPLES.find(s => q && (s.question.includes(q) || q.includes(s.question)));
  return hit || null;
}

const $q = document.getElementById("q");
const $go = document.getElementById("go");
const $note = document.getElementById("note");
const $banner = document.getElementById("banner");

async function run(){
  const q = $q.value.trim();
  if (!q){ $q.focus(); return; }
  $go.disabled = true;
  $note.innerHTML = '<span class="spin"></span> 正在检索与核验……';
  try{
    const rec = await ask(q);
    if (rec){ render(rec); $note.textContent = ""; }
    else {
      $note.innerHTML = live
        ? "没有拿到结果，请查看运行窗口的报错。"
        : '离线演示模式：只内置了下面几个示例问题，其他问题需要启动本地服务才能实问。';
    }
  }catch(e){
    $note.textContent = "出错：" + e.message;
  }finally{
    $go.disabled = false;
  }
}

$go.onclick = run;
$q.addEventListener("keydown", e => { if (e.key === "Enter") run(); });

/* ── 初始化 ───────────────────────────────────────────────────── */
(async function init(){
  const chips = document.getElementById("chips");
  chips.innerHTML = SAMPLES.map(s =>
    `<button class="chip" data-q="${esc(s.question)}">${esc(s.tag || s.question.slice(0, 26) + "…")}</button>`).join("");
  chips.querySelectorAll(".chip").forEach(c => c.onclick = () => { $q.value = c.dataset.q; run(); });

  try{
    const r = await fetch("/api/health", {cache:"no-store"});
    live = r.ok;
  }catch(_){ live = false; }

  $banner.innerHTML = live
    ? `<div class="banner">已连接本地服务 —— 可以直接提问，走真实的检索 + 核验链路。</div>`
    : `<div class="banner offline">离线演示模式 —— 未连接本地服务，点击下面的示例问题查看真实输出；
       要自由提问，请运行 <code>python scripts/serve_demo.py</code> 后打开它给出的地址。</div>`;

  // 支持 #s3 直接定位到第 4 个样本 —— 演示时可以直接给一个"看这个案例"的链接
  const m = /^#s(\d+)$/.exec(location.hash || "");
  const first = m && SAMPLES[+m[1] - 1] ? SAMPLES[+m[1] - 1] : SAMPLES[0];
  if (first) { $q.value = first.question; render(first); }
})();
</script>
